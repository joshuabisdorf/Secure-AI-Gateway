services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SAG_PROVIDER: ${SAG_PROVIDER:-mock}
      SAG_CLIENT_REGISTRY_BACKEND: postgres
      SAG_USAGE_LEDGER_BACKEND: postgres
      SAG_RATE_LIMIT_BACKEND: redis
      SAG_SEMANTIC_PII_BACKEND: ${SAG_SEMANTIC_PII_BACKEND:-spacy}
      SAG_TOOL_EXECUTION_POLICY_FILE: /app/config/tool-execution-policies.example.json
      SAG_TOOL_EXECUTION_SIGNING_KEY: ${SAG_TOOL_EXECUTION_SIGNING_KEY:-}
      SAG_TOOL_EXECUTION_TTL_SECONDS: ${SAG_TOOL_EXECUTION_TTL_SECONDS:-120}
      SAG_TOOL_EXECUTION_REPLAY_BACKEND: redis
      SAG_ALLOWED_MODELS: ${SAG_ALLOWED_MODELS:-}
      SAG_SECURITY_POLICY_FILE: /app/config/security-policies.json
      SAG_OTEL_ENABLED: ${SAG_OTEL_ENABLED:-true}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-secure-ai-gateway}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      DATABASE_URL: postgresql://sag:${POSTGRES_PASSWORD:-sag_dev_password}@postgres:5432/secure_ai_gateway
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${SAG_SECURITY_POLICY_HOST_FILE:-./config/security-policies.json}:/app/config/security-policies.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: secure_ai_gateway
      POSTGRES_USER: sag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sag_dev_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sag_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sag -d secure_ai_gateway"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.10.1-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - sag_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.13.2
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - sag_prometheus_data:/prometheus

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    restart: unless-stopped
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    ports:
      - "127.0.0.1:4318:4318"
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro

volumes:
  sag_postgres_data:
  sag_redis_data:
  sag_prometheus_data:
