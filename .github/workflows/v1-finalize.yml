name: One-time v1.0.0 release finalizer

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

concurrency:
  group: one-time-v1-release-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    name: Tag and publish v1.0.0
    if: >-
      startsWith(
        github.event.head_commit.message,
        'Add one-time v1.0.0 release finalizer (#17)'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_COMMIT: 8596fab42191d53888498b3d0d5a77f8c5451bc6
      RELEASE_TAG: v1.0.0
      EXPECTED_DIGEST: >-
        sha256:ec778ed6bf40a149245b36eebcc06e166becf41df23e6c9393290b7fab5239e3

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify reviewed release commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$RELEASE_COMMIT^{commit}")" = "$RELEASE_COMMIT"
          git merge-base --is-ancestor "$RELEASE_COMMIT" HEAD
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "$RELEASE_TAG already exists." >&2
            exit 1
          fi

      - name: Verify immutable public image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHORT_SHA="${RELEASE_COMMIT:0:12}"
          SHA_REF="$IMAGE:sha-$SHORT_SHA"
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker pull "$SHA_REF" >/dev/null
          DIGEST="$(
            docker buildx imagetools inspect "$SHA_REF" \
              --format '{{json .Manifest}}' \
              | jq -r '.digest'
          )"
          test "$DIGEST" = "$EXPECTED_DIGEST"
          echo "immutable_image=$SHA_REF"
          echo "immutable_digest=$DIGEST"

      - name: Create annotated stable tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$RELEASE_COMMIT" \
            -m "Secure AI Gateway v1.0.0"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin

      - name: Publish stable image alias
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHORT_SHA="${RELEASE_COMMIT:0:12}"
          SHA_REF="$IMAGE:sha-$SHORT_SHA"
          RELEASE_REF="$IMAGE:$RELEASE_TAG"
          docker pull "$SHA_REF" >/dev/null
          docker tag "$SHA_REF" "$RELEASE_REF"
          docker push "$RELEASE_REF"

      - name: Verify stable digest
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          RELEASE_REF="$IMAGE:$RELEASE_TAG"
          DIGEST="$(
            docker buildx imagetools inspect "$RELEASE_REF" \
              --format '{{json .Manifest}}' \
              | jq -r '.digest'
          )"
          test "$DIGEST" = "$EXPECTED_DIGEST"
          echo "release_image=$RELEASE_REF"
          echo "release_digest=$DIGEST"

      - name: Verify anonymous stable pull
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          RELEASE_REF="$IMAGE:$RELEASE_TAG"
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker image rm "$RELEASE_REF" >/dev/null 2>&1 || true
          docker pull "$RELEASE_REF" >/dev/null
          echo "anonymous_release_pull=OK"

      - name: Summary
        shell: bash
        run: |
          {
            echo '## Stable v1.0.0 release finalized'
            echo
            echo "Release commit: $RELEASE_COMMIT"
            echo "Release tag: $RELEASE_TAG"
            echo "OCI digest: $EXPECTED_DIGEST"
            echo
            echo 'The immutable and stable tags resolve to the same digest.'
            echo 'The stable image was pulled anonymously.'
          } >> "$GITHUB_STEP_SUMMARY"
