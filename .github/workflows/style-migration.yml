name: Temporary style migration

on:
  push:
    branches:
      - pre-v1-full-style-conformance

permissions:
  contents: write

concurrency:
  group: temporary-style-migration
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: pre-v1-full-style-conformance
          fetch-depth: 0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.16.2"
          terraform_wrapper: false

      - name: Restore canonical Terraform formatting
        run: terraform fmt -recursive terraform

      - name: Check generated patch
        run: git diff --check

      - name: Commit formatting result
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "terraform_format=no_changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add terraform
          git commit -m "Restore canonical Terraform formatting"
          git push origin HEAD:pre-v1-full-style-conformance
