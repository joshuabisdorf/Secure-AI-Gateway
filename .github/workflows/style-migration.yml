name: Temporary style migration

on:
  push:
    branches:
      - pre-v1-full-style-conformance

permissions:
  contents: write

concurrency:
  group: temporary-style-migration
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: pre-v1-full-style-conformance
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Repair temporary migrator guard
        shell: bash
        run: |
          set -euo pipefail
          sed -i \
            's/if not body:/if not isinstance(body, list) or not body:/' \
            .github/style_migrate.py
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/style_migrate.py")
          text = path.read_text(encoding="utf-8")
          marker = "    for path in _tracked_files():\n"
          replacement = (
              marker
              + "        if path.parts[:2] == (\".github\", \"workflows\"):\n"
              + "            continue\n"
          )
          if replacement not in text:
              text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply project-owned migration
        run: |
          python .github/style_migrate.py
          python .github/style_residual_fix.py

      - name: Check generated patch
        run: git diff --check

      - name: Commit migration result
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "style_migration=no_changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply residual project-owned style migration"
          git push origin HEAD:pre-v1-full-style-conformance
