name: Temporary style migration

on:
  push:
    branches:
      - pre-v1-full-style-conformance

permissions:
  contents: write

concurrency:
  group: temporary-style-migration
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: pre-v1-full-style-conformance
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Apply targeted project-owned migration
        run: python .github/style_targeted_fix.py

      - name: Check generated patch
        run: git diff --check

      - name: Validate touched shell syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/aws-cloud-deploy.sh
          bash -n scripts/aws-cloud-verify.sh
          bash -n scripts/demo.sh
          bash -n scripts/k8s-local-up.sh
          bash -n scripts/k8s-verify.sh
          bash -n scripts/resilience-smoke.sh

      - name: Commit migration result
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "style_migration=no_changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply targeted final style corrections"
          git push origin HEAD:pre-v1-full-style-conformance
