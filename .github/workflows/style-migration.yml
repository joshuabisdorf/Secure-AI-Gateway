name: Temporary style migration

on:
  push:
    branches:
      - pre-v1-project-style

permissions:
  contents: write

jobs:
  migrate:
    if: >-
      !contains(
        github.event.head_commit.message,
        '[style-migrated]'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out migration branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: pre-v1-project-style
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install one-time migration helpers
        run: >-
          python -m pip install
          black==25.1.0
          mdformat==0.7.22

      - name: Reformat Python mechanically
        run: >-
          black
          --line-length 80
          app
          scripts
          tests

      - name: Reflow Markdown mechanically
        shell: bash
        run: |
          mapfile -t files < <(
            git ls-files '*.md'
          )
          mdformat --wrap 80 "${files[@]}"

      - name: Commit migration output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Apply mechanical style migration [style-migrated]'
          git push origin HEAD:pre-v1-project-style
