name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run test suite
        run: pytest -q

  security-analysis:
    name: Security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and security tooling
        run: python -m pip install -e '.[dev]'

      - name: Scan Python source for common security defects
        run: bandit -q -r app -ll -ii

      - name: Audit installed Python dependencies
        run: python -m pip_audit --progress-spinner off --skip-editable

  prompt-injection-benchmark:
    name: Prompt-injection benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Enforce benchmark baseline
        run: >-
          python -m app.evals.prompt_injection_benchmark
          --enforce-baseline
          --show-errors

  semantic-pii-benchmark:
    name: Semantic PII benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Enforce semantic PII baseline
        run: >-
          python -m app.evals.semantic_pii_benchmark
          --enforce-baseline
          --show-errors

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Validate deployment shell syntax
        run: >-
          bash -n
          scripts/aws-cloud-preflight.sh
          scripts/aws-cloud-deploy.sh
          scripts/aws-cloud-verify.sh

      - name: Enforce billable AWS opt-in guard
        run: |
          grep -Fq 'SAG_ALLOW_BILLABLE_AWS' scripts/aws-cloud-deploy.sh
          grep -Fq 'SAG_CONFIRM_AWS_APPLY' scripts/aws-cloud-deploy.sh
          grep -Fq 'require_billable_aws_opt_in' scripts/aws-cloud-deploy.sh

      - name: Build gateway image
        run: docker build --tag secure-ai-gateway:ci .

  kubernetes-manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.37.0

      - name: Render Kustomize manifests
        run: |
          kubectl kustomize k8s/ci > rendered-kubernetes.yaml
          kubectl kustomize k8s/cloud > rendered-cloud-kubernetes.yaml

      - name: Reject committed Kubernetes Secret objects
        run: >-
          if grep -q '^kind: Secret$' rendered-kubernetes.yaml rendered-cloud-kubernetes.yaml; then
            echo 'Kubernetes Secret objects must not be committed in rendered deployment targets.' >&2;
            exit 1;
          fi

      - name: Validate Kubernetes schemas strictly
        uses: azure/k8s-lint@e4234c50ea835112e72b145bdecd00a94bad42fd # v4
        with:
          manifests: |
            rendered-kubernetes.yaml
            rendered-cloud-kubernetes.yaml
          kubeconformOpts: -strict

      - name: Validate Kubernetes 1.37 compatibility
        uses: azure/k8s-lint@e4234c50ea835112e72b145bdecd00a94bad42fd # v4
        with:
          manifests: |
            rendered-kubernetes.yaml
            rendered-cloud-kubernetes.yaml
          kubeconformOpts: -kubernetes-version=1.37.0

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.16.2"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -diff -recursive terraform

      - name: Initialize state bootstrap configuration
        run: terraform -chdir=terraform/bootstrap init -backend=false -input=false

      - name: Validate state bootstrap configuration
        run: terraform -chdir=terraform/bootstrap validate -no-color

      - name: Initialize AWS environment configuration
        run: terraform -chdir=terraform/aws init -backend=false -input=false

      - name: Validate AWS environment configuration
        run: terraform -chdir=terraform/aws validate -no-color
