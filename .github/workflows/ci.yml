name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run test suite
        run: pytest -q

  prompt-injection-benchmark:
    name: Prompt-injection benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Enforce benchmark baseline
        run: >-
          python -m app.evals.prompt_injection_benchmark
          --enforce-baseline
          --show-errors

  semantic-pii-benchmark:
    name: Semantic PII benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Enforce semantic PII baseline
        run: >-
          python -m app.evals.semantic_pii_benchmark
          --enforce-baseline
          --show-errors

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build gateway image
        run: docker build --tag secure-ai-gateway:ci .

  kubernetes-manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.37.0

      - name: Render Kustomize manifests
        run: kubectl kustomize k8s/ci > rendered-kubernetes.yaml

      - name: Reject committed Kubernetes Secret objects
        run: >-
          if grep -q '^kind: Secret$' rendered-kubernetes.yaml; then
            echo 'Kubernetes Secret objects must be created from ignored runtime configuration.' >&2;
            exit 1;
          fi

      - name: Validate Kubernetes schemas strictly
        uses: azure/k8s-lint@v4
        with:
          manifests: rendered-kubernetes.yaml
          kubeconformOpts: -strict

      - name: Validate Kubernetes 1.37 compatibility
        uses: azure/k8s-lint@v4
        with:
          manifests: rendered-kubernetes.yaml
          kubeconformOpts: -kubernetes-version=1.37.0

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.2"
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -diff -recursive terraform

      - name: Initialize state bootstrap configuration
        run: terraform -chdir=terraform/bootstrap init -backend=false -input=false

      - name: Validate state bootstrap configuration
        run: terraform -chdir=terraform/bootstrap validate -no-color

      - name: Initialize AWS environment configuration
        run: terraform -chdir=terraform/aws init -backend=false -input=false

      - name: Validate AWS environment configuration
        run: terraform -chdir=terraform/aws validate -no-color
