name: Release container

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  container:
    name: Build and publish public container
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Derive immutable image tags
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHORT_SHA="${GITHUB_SHA:0:12}"
          {
            echo "image=$IMAGE"
            echo "sha_tag=sha-$SHORT_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" \
            | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build immutable image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${{ steps.image.outputs.image }}:${{ steps.image.outputs.sha_tag }}" \
            .

      - name: Smoke-test built image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint python \
            "${{ steps.image.outputs.image }}:${{ steps.image.outputs.sha_tag }}" \
            -c 'import app.server; print("production_server_import=OK")'

      - name: Publish immutable image
        shell: bash
        run: |
          set -euo pipefail
          docker push "${{ steps.image.outputs.image }}:${{ steps.image.outputs.sha_tag }}"

      - name: Resolve published image digest
        id: published
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_REF="${{ steps.image.outputs.image }}:${{ steps.image.outputs.sha_tag }}"
          DIGEST="$(
            docker buildx imagetools inspect "$IMAGE_REF" --format '{{json .Manifest}}' \
              | jq -r '.digest'
          )"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid image digest: $DIGEST" >&2
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "published_digest=$DIGEST"

      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.image.outputs.image }}@${{ steps.published.outputs.digest }}
          format: spdx-json
          output-file: secure-ai-gateway.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest image build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.published.outputs.digest }}
          push-to-registry: true

      - name: Attest image SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.published.outputs.digest }}
          sbom-path: secure-ai-gateway.spdx.json
          push-to-registry: true

      - name: Publish release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="${GITHUB_REF_NAME,,}"
          docker tag \
            "${{ steps.image.outputs.image }}:${{ steps.image.outputs.sha_tag }}" \
            "${{ steps.image.outputs.image }}:${RELEASE_TAG}"
          docker push "${{ steps.image.outputs.image }}:${RELEASE_TAG}"

      - name: Verify anonymous public pull
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_REF="${{ steps.image.outputs.image }}:${{ steps.image.outputs.sha_tag }}"
          docker logout ghcr.io >/dev/null 2>&1 || true
          docker image rm "$IMAGE_REF" >/dev/null
          docker pull "$IMAGE_REF" >/dev/null
          docker run --rm \
            --entrypoint python \
            "$IMAGE_REF" \
            -c 'import app.server; print("anonymous_public_pull=OK")'

      - name: Summary
        shell: bash
        run: |
          {
            echo '## Zero-cost container release'
            echo
            echo 'Published using the repository GITHUB_TOKEN; no AWS account or cloud infrastructure is required.'
            echo 'The workflow generated SPDX SBOM and build-provenance attestations for the immutable image digest.'
            echo 'The workflow logged out of GHCR and successfully pulled the image anonymously, proving public package access.'
            echo
            echo '```text'
            echo '${{ steps.image.outputs.image }}:${{ steps.image.outputs.sha_tag }}'
            echo '${{ steps.image.outputs.image }}@${{ steps.published.outputs.digest }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
