version: 2
updates:
  # Routine version updates are monthly; security alerts remain independent.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    cooldown:
      default-days: 3
      semver-patch-days: 21
    groups:
      pip-routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    groups:
      codeql-action:
        applies-to: version-updates
        patterns:
          - "github/codeql-action/*"
      actions-routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    cooldown:
      # Avoid an extended delay for base-image patches.
      default-days: 3
    groups:
      docker-routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
