apiVersion: batch/v1
kind: Job
metadata:
  name: sag-migrate
  namespace: secure-ai-gateway
  labels:
    app.kubernetes.io/name: secure-ai-gateway
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secure-ai-gateway
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: secure-ai-gateway:local
          imagePullPolicy: IfNotPresent
          args:
            - python
            - -m
            - app.database
            - migrate
          envFrom:
            - configMapRef:
                name: sag-gateway-config
            - secretRef:
                name: sag-runtime-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: security-policy
              mountPath: /app/runtime-config/security
              readOnly: true
            - name: tool-execution-policy
              mountPath: /app/runtime-config/tools
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: security-policy
          configMap:
            name: sag-security-policy
        - name: tool-execution-policy
          configMap:
            name: sag-tool-execution-policy
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
