apiVersion: v1
kind: Service
metadata:
  name: sag-gateway
  namespace: secure-ai-gateway
  labels:
    app.kubernetes.io/name: secure-ai-gateway
    app.kubernetes.io/component: gateway
spec:
  selector:
    app.kubernetes.io/name: secure-ai-gateway
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sag-gateway
  namespace: secure-ai-gateway
  labels:
    app.kubernetes.io/name: secure-ai-gateway
    app.kubernetes.io/component: gateway
spec:
  replicas: 2
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: secure-ai-gateway
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secure-ai-gateway
        app.kubernetes.io/component: gateway
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: secure-ai-gateway
              app.kubernetes.io/component: gateway
      containers:
        - name: gateway
          image: secure-ai-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: sag-gateway-config
            - secretRef:
                name: sag-runtime-secrets
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - python
                - -m
                - app.readiness
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 2
            successThreshold: 1
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: security-policy
              mountPath: /app/runtime-config/security
              readOnly: true
            - name: tool-execution-policy
              mountPath: /app/runtime-config/tools
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: security-policy
          configMap:
            name: sag-security-policy
        - name: tool-execution-policy
          configMap:
            name: sag-tool-execution-policy
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sag-gateway
  namespace: secure-ai-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: secure-ai-gateway
      app.kubernetes.io/component: gateway
